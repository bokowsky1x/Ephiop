<div class="mb-3">
  <label class="form-label" for="message-image">Изображение</label>
  <input id="message-image" class="form-control" type="file" name="image" accept="image/jpeg,image/png,image/webp">
  {% if current_image %}
  <a href="{{ url_for('media', name=current_image) }}" target="_blank" rel="noopener">
    <img src="{{ url_for('media', name=current_image) }}" alt="Прикреплённое изображение" class="mt-2" style="max-width:100%;height:100px;object-fit:contain">
  </a>
  <div class="form-check mt-2">
    <input class="form-check-input" type="checkbox" name="remove_image" id="remove-image">
    <label class="form-check-label" for="remove-image">Удалить изображение</label>
  </div>
  {% endif %}
</div>
